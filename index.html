<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <meta http-equiv="refresh" content="0; url=pages/home.html" />
    <title>旅行路线助手</title>
    <link href="https://fonts.googleapis.com/css?family=Montserrat:400,700,800" rel="stylesheet" type="text/css" />
    <link href="https://fonts.googleapis.com/css?family=Roboto+Slab:400,300" rel="stylesheet" type="text/css" />
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            min-height:100vh; display:flex; align-items:center; justify-content:center;
            background: linear-gradient(135deg, #212529 0%, #343a40 100%);
            color:#fff; font-family:"Montserrat","Microsoft YaHei",sans-serif;
        }
        .box { text-align:center; padding:3rem; }
        .spinner {
            width:48px; height:48px;
            border:4px solid rgba(255,200,0,0.2);
            border-top-color:#ffc800;
            border-radius:50%;
            animation:spin .8s linear infinite;
            margin:0 auto 1.5rem;
        }
        @keyframes spin { to { transform:rotate(360deg); } }
        h1 { font-size:1.75rem; font-weight:800; text-transform:uppercase; letter-spacing:.1em; margin-bottom:.5rem; }
        p { opacity:.7; font-family:"Roboto Slab","Microsoft YaHei",serif; font-style:italic; }
        a { color:#ffc800; text-decoration:none; font-weight:700; }
        a:hover { text-decoration:underline; }
    </style>
</head>
<body>
    <div class="box">
        <div class="spinner"></div>
        <h1>旅行路线助手</h1>
        <p>正在跳转到首页...</p>
        <p style="margin-top:1rem">如果没有自动跳转，请<a href="pages/home.html">点击这里</a></p>
    </div>
</body>
</html>
