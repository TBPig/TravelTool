<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>出行助手 - 旅行路线助手</title>
    <link href="../styles/agency.css" rel="stylesheet" />
    <link href="../styles/styles.css" rel="stylesheet" />
    <script src="../scripts/config.js"></script>
    <script src="../scripts/auth.js"></script>
    <script src="../scripts/header.js" defer></script>
    <script src="../scripts/sidebar.js" defer></script>
    <script src="../scripts/agency-nav.js" defer></script>
    <script src="../scripts/trip.js" defer></script>
</head>
<body id="page-top">
    <header id="header-container"></header>
    <aside id="sidebar-container"></aside>

    <!-- Status Bar -->
    <section class="status-bar">
        <div class="container">
            <div class="status-left">
                <div class="trip-timer">
                    <div class="timer-label">已进行</div>
                    <div class="timer-value" id="trip-timer">00:00</div>
                </div>
                <div class="progress-info">
                    <div class="progress-text">
                        <span>行程进度</span>
                        <span id="progress-percent">0%</span>
                    </div>
                    <div class="progress-bar">
                        <div class="progress-fill" id="progress-fill" style="width:0%"></div>
                    </div>
                </div>
            </div>
            <div style="display:flex;align-items:center;gap:1rem">
                <div style="display:flex;align-items:center;gap:0.5rem;background:rgba(255,255,255,0.1);padding:0.5rem 1rem;border-radius:0.375rem;font-size:0.9rem">
                    🌤 <span id="weather-temp">--°C</span>
                </div>
                <button class="btn btn-outline-light btn-sm text-uppercase" onclick="endTrip()">结束行程</button>
            </div>
        </div>
    </section>

    <!-- Three-Column Grid -->
    <div class="trip-grid">
        <!-- Map -->
        <div class="trip-panel">
            <div class="panel-header">
                <span>🗺 实时地图</span>
            </div>
            <div class="panel-body">
                <div class="map-view" id="map-view">
                    <div class="map-placeholder">
                        <div class="map-icon">📍</div>
                        <p>当前位置加载中...</p>
                    </div>
                </div>
                <div class="route-overlay">
                    <div class="d-flex justify-content-between flex-wrap">
                        <div>
                            <small class="text-muted text-uppercase fw-bold">下一站</small>
                            <div class="fw-bold" id="next-stop" style="font-size:1.1rem">--</div>
                        </div>
                        <div class="d-flex gap-3">
                            <small class="text-muted">⏱ <span id="eta">--</span></small>
                            <small class="text-muted">📏 <span id="distance">--</span></small>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Current Attraction -->
        <div class="trip-panel">
            <div class="panel-header">
                <span>📍 当前景点</span>
                <span class="badge-status badge-gold" id="attraction-status">即将到达</span>
            </div>
            <div class="panel-body" id="current-attraction">
                <div class="loading">等待行程开始...</div>
            </div>
        </div>

        <!-- Assistant -->
        <div class="trip-panel">
            <div class="panel-header">
                <span>🤖 智能助手</span>
            </div>
            <div class="panel-body d-flex flex-column">
                <div class="flex-grow-1 d-flex flex-column gap-2 mb-3" id="chat-messages">
                    <div class="chat-msg assistant">你好！我是您的旅行助手，有任何问题随时问我。</div>
                </div>
                <div class="d-flex gap-2">
                    <input type="text" class="form-control" id="chat-input" placeholder="输入您的问题..." />
                    <button class="btn btn-warning btn-sm text-uppercase" onclick="sendMessage()" style="background:#ffc800;border-color:#ffc800;color:#212529;white-space:nowrap">发送</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Horizontal Timeline -->
    <section class="page-section bg-light" style="padding:2rem 0">
        <div class="container">
            <h3 class="text-uppercase fw-bold mb-3" style="font-size:1.1rem">行程路线</h3>
            <div class="timeline-horizontal" id="timeline-horizontal">
                <div class="text-center w-100 text-muted py-4">正在加载...</div>
            </div>
        </div>
    </section>
</body>
</html>
