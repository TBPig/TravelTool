<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>旅行路线助手 - 智能规划您的行程</title>
    <link href="../styles/agency.css" rel="stylesheet" />
    <link href="../styles/styles.css" rel="stylesheet" />
    <script src="../scripts/config.js"></script>
    <script src="../scripts/auth.js"></script>
    <script src="../scripts/header.js" defer></script>
    <script src="../scripts/sidebar.js" defer></script>
    <script src="../scripts/agency-nav.js" defer></script>
    <script src="../scripts/home.js" defer></script>
</head>
<body id="page-top">
    <header id="header-container"></header>
    <aside id="sidebar-container"></aside>

    <!-- Masthead -->
    <header class="masthead">
        <div class="container">
            <div class="masthead-subheading">探索世界，发现美好</div>
            <div class="masthead-heading text-uppercase">智能规划您的旅行</div>
            <a class="btn btn-primary btn-xl text-uppercase" href="#planner">开始规划</a>
        </div>
    </header>

    <!-- Route Planner -->
    <section class="page-section" id="planner">
        <div class="container">
            <div class="text-center">
                <h2 class="section-heading text-uppercase">定制路线</h2>
                <h3 class="section-subheading text-muted">输入出行信息，获取个性化路线推荐</h3>
            </div>

            <div class="row justify-content-center">
                <div class="col-lg-10">
                    <div class="bg-white rounded shadow p-4 p-lg-5">
                        <div class="row g-3">
                            <div class="col-md-4">
                                <div class="form-group">
                                    <label class="fw-bold mb-2">出发地</label>
                                    <input class="form-control" type="text" id="departure" placeholder="请输入出发地" />
                                </div>
                            </div>
                            <div class="col-md-4">
                                <div class="form-group">
                                    <label class="fw-bold mb-2">目的地</label>
                                    <input class="form-control" type="text" id="destination" placeholder="请输入目的地" />
                                </div>
                            </div>
                            <div class="col-md-4">
                                <div class="form-group">
                                    <label class="fw-bold mb-2">兴趣标签</label>
                                    <div class="multi-select" id="interests-container">
                                        <div class="multi-select-trigger" onclick="toggleInterestsDropdown()">
                                            <span class="multi-select-placeholder" id="interests-display">请选择兴趣标签</span>
                                            <span class="multi-select-arrow">▼</span>
                                        </div>
                                        <div class="multi-select-dropdown" id="interests-dropdown">
                                            <label class="multi-select-option"><input type="checkbox" value="photo" onchange="updateInterestsSelection()" /><span>📸 拍照打卡</span></label>
                                            <label class="multi-select-option"><input type="checkbox" value="food" onchange="updateInterestsSelection()" /><span>🍜 美食探索</span></label>
                                            <label class="multi-select-option"><input type="checkbox" value="culture" onchange="updateInterestsSelection()" /><span>🏛 人文历史</span></label>
                                            <label class="multi-select-option"><input type="checkbox" value="nature" onchange="updateInterestsSelection()" /><span>🏞 自然风光</span></label>
                                            <label class="multi-select-option"><input type="checkbox" value="shopping" onchange="updateInterestsSelection()" /><span>🛍 购物血拼</span></label>
                                            <label class="multi-select-option"><input type="checkbox" value="adventure" onchange="updateInterestsSelection()" /><span>🧗 户外探险</span></label>
                                            <label class="multi-select-option"><input type="checkbox" value="relax" onchange="updateInterestsSelection()" /><span>🌴 休闲度假</span></label>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <div class="col-md-4">
                                <div class="form-group">
                                    <label class="fw-bold mb-2">出行天数</label>
                                    <select class="form-control" id="days">
                                        <option value="">请选择天数</option>
                                        <option value="1-3">1-3天（短途游）</option>
                                        <option value="4-7">4-7天（一周游）</option>
                                        <option value="8-15">8-15天（深度游）</option>
                                        <option value="15+">15天以上（长途游）</option>
                                    </select>
                                </div>
                            </div>
                            <div class="col-md-4">
                                <div class="form-group">
                                    <label class="fw-bold mb-2">游玩强度</label>
                                    <select class="form-control" id="intensity">
                                        <option value="">请选择强度</option>
                                        <option value="relaxed">休闲轻松（每天1-2个景点）</option>
                                        <option value="moderate">适中节奏（每天3-4个景点）</option>
                                        <option value="intensive">紧凑充实（每天5+个景点）</option>
                                    </select>
                                </div>
                            </div>
                            <div class="col-md-4">
                                <div class="form-group">
                                    <label class="fw-bold mb-2">同行人类型</label>
                                    <select class="form-control" id="companion">
                                        <option value="">请选择同行人类型</option>
                                        <option value="solo">🚶 独自一人</option>
                                        <option value="couple">💑 情侣出游</option>
                                        <option value="family">👨‍👩‍👧 亲子家庭</option>
                                        <option value="friends">👬 朋友结伴</option>
                                        <option value="elderly">🧓 长辈同行</option>
                                    </select>
                                </div>
                            </div>
                        </div>

                        <div class="profile-summary mt-3" id="profile-summary" style="display:none">
                            <span class="summary-title">当前画像：</span>
                            <span id="summary-tags"></span>
                            <button class="btn btn-outline-danger btn-sm ms-auto" onclick="clearUserProfile()">清除画像</button>
                        </div>

                        <div class="text-center mt-4">
                            <button class="btn btn-outline-dark btn-xl text-uppercase me-3" onclick="saveUserProfile()">保存画像</button>
                            <button class="btn btn-warning btn-xl text-uppercase" onclick="generateRoute()" style="background:#ffc800;border-color:#ffc800;color:#212529">生成路线建议</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- Services / Features -->
    <section class="page-section bg-light" id="features">
        <div class="container">
            <div class="text-center">
                <h2 class="section-heading text-uppercase">为什么选择我们</h2>
                <h3 class="section-subheading text-muted">让每一次旅行都成为美好回忆</h3>
            </div>
            <div class="row text-center">
                <div class="col-md-3">
                    <span class="fa-stack fa-4x">
                        <i class="fas fa-circle fa-stack-2x text-warning"></i>
                        <i class="fas fa-map-marked-alt fa-stack-1x fa-inverse"></i>
                    </span>
                    <h4 class="my-3">智能推荐</h4>
                    <p class="text-muted">根据您的偏好智能匹配最佳路线</p>
                </div>
                <div class="col-md-3">
                    <span class="fa-stack fa-4x">
                        <i class="fas fa-circle fa-stack-2x text-warning"></i>
                        <i class="fas fa-clipboard-list fa-stack-1x fa-inverse"></i>
                    </span>
                    <h4 class="my-3">详细规划</h4>
                    <p class="text-muted">每日行程详细安排，景点顺序优化</p>
                </div>
                <div class="col-md-3">
                    <span class="fa-stack fa-4x">
                        <i class="fas fa-circle fa-stack-2x text-warning"></i>
                        <i class="fas fa-calculator fa-stack-1x fa-inverse"></i>
                    </span>
                    <h4 class="my-3">预算参考</h4>
                    <p class="text-muted">提供详细的预算估算，合理规划开支</p>
                </div>
                <div class="col-md-3">
                    <span class="fa-stack fa-4x">
                        <i class="fas fa-circle fa-stack-2x text-warning"></i>
                        <i class="fas fa-star fa-stack-1x fa-inverse"></i>
                    </span>
                    <h4 class="my-3">精选路线</h4>
                    <p class="text-muted">实地验证的优质路线，避免踩坑</p>
                </div>
            </div>
        </div>
    </section>

    <!-- Popular Routes (Portfolio Grid) -->
    <section class="page-section" id="routes">
        <div class="container">
            <div class="text-center">
                <h2 class="section-heading text-uppercase">精选推荐路线</h2>
                <h3 class="section-subheading text-muted">最受欢迎的旅行方案</h3>
            </div>
            <div class="row" id="routes-container">
                <div class="col-12 text-center py-5 text-muted">正在加载路线数据...</div>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="footer py-4">
        <div class="container">
            <div class="row align-items-center">
                <div class="col-lg-4 text-lg-start">Copyright &copy; 旅行路线助手 2024</div>
                
                <div class="col-lg-4 text-lg-end">
                    <a class="link-dark text-decoration-none me-3" href="#!">关于我们</a>
                    <a class="link-dark text-decoration-none" href="#!">帮助中心</a>
                </div>
            </div>
        </div>
    </footer>
</body>
</html>
